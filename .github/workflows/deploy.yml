name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_GISCUS_REPO: "Mutantcat-Working-Group/BeverageWiki"
          NEXT_PUBLIC_GISCUS_REPO_ID: "R_kgDOP7oV1Q"
          NEXT_PUBLIC_GISCUS_CATEGORY: "General"
          NEXT_PUBLIC_GISCUS_CATEGORY_ID: "DIC_kwDOP7oV1c4CwOhS"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
