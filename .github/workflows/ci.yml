name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      NEXT_PUBLIC_GISCUS_REPO: Mutantcat-Working-Group/BeverageWiki
      NEXT_PUBLIC_GISCUS_REPO_ID: R_kgDOP7oV1Q
      NEXT_PUBLIC_GISCUS_CATEGORY: General
      NEXT_PUBLIC_GISCUS_CATEGORY_ID: DIC_kwDOP7oV1c4CwOhS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          rm -f package-lock.json
          npm install
      - run: npm run build
      - name: Smoke test exported site
        run: |
          test -f out/index.html
          test -s out/index.html
          python3 -m http.server 8080 -d out >/tmp/http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 1
          curl -fsS http://127.0.0.1:8080/ -o /tmp/index.html
          test -s /tmp/index.html
